services:
  postgres:
    image: postgres:16-alpine
    container_name: de-lab-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - .env
    volumes:
      - de-lab-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  de-lab-data:
