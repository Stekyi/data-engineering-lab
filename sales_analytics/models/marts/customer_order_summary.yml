version: 2

models:
  - name: customer_order_summary
    description: "A summary of customer orders, including total orders and total amount spent."
    columns:
      - name: customer_id
        description: "The unique identifier for each customer."
        data_tests:
          - not_null
          - unique
      - name: total_orders
        description: "The total number of orders placed by the customer."
        data_tests:
          - not_null
      - name: total_order_amount
        description: "The total amount spent by the customer across all orders."
        data_tests:
          - not_null